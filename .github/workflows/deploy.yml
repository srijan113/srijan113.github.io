# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Repo "srijan113.github.io" → https://srijan113.github.io/ (base "/")
      # Any other repo, e.g. "portfolio" → https://srijan113.github.io/portfolio/ (base "/portfolio/")
      # Custom domain: set the repository variable CUSTOM_DOMAIN (e.g. srijanpokhrel.com.np).
      - name: Work out site URL and base path
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            base="/"; url="https://${CUSTOM_DOMAIN}"
          elif [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "${owner}.github.io" ]; then
            base="/"; url="https://${owner}.github.io"
          else
            base="/${repo}/"; url="https://${owner}.github.io/${repo}"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${url} (base ${base})"

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
          VITE_SITE_URL: ${{ steps.site.outputs.url }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
